<div style="margin-top: 80px;"></div>
<div class="mt-3 p-3">
<button class="btn bg-p-b p-3" (click)="abrirmodalAgregar()">AGREGAR</button>
</div>

<div class="p-4">
    <app-loader *ngIf="loading"></app-loader>
</div>

<div class="p-3">
    <table class="table" data-bs-theme="dark">
        <thead>
          <tr>
            <th scope="col">NOMBRE</th>
            <th scope="col">SUCURSALES</th>
            <th scope="col"></th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of arr_data">
            <td>{{item.nombre}}</td>
            <td>
                
               <div class="d-flex justify-content-start flex-wrap gap-3" >
                @for (itemsuc of getSucursalesGrupo(item.jdata); track $index) 
                {
                    <p-tag severity="secondary" [value]="itemsuc.name" [rounded]="true"/>
                }
               </div>

            </td>
            <td>
                <button class="btn btn-primary me-3" (click)="editar(item)"><i class='bx bx-edit bx-sm' ></i></button>
            </td>
            <td><button class="btn btn-danger" (click)="confirm(item.id)"><i class='bx bx-trash bx-sm' ></i></button></td>
          </tr>
        </tbody>
      </table>
</div>

<p-dialog [header]="actualizar ? 'Actualizar' :'Agregar'" [(visible)]="modalAgregar" [modal]="true" [style]="{ 'width': '95vh', 'max-width':'50rem' }" [draggable]="false" [resizable]="false">
    
    <p class="fw-bold text-center">NOMBRE</p>
    <div class="p-3">
        <input type="text" class="form-control p-1 text-center" [(ngModel)]="formnombre">
    </div>

    <div class="p-3" style="min-height: 300px;">
        <p-multiSelect 
        [options]="catsucursales" 
        [(ngModel)]="sucursalesSel" 
        optionLabel="name" 
        placeholder="SUCURSALES" 
        [style]="{'width':'100%'}"
        />
    </div>

    <app-loader *ngIf="loading"></app-loader>

    <div class="mt-3 mb-3 d-flex  justify-content-end">
        <button class="btn bg-p-b p-3 rounded-4" (click)="agregar()" *ngIf="actualizar == false"> <i class='bx bx-save' ></i> GUARDAR</button>
        <button class="btn bg-p-b p-3 rounded-4" (click)="Actualizar()" *ngIf="actualizar"> <i class='bx bx-save' ></i> ACTUALIZAR</button>
    </div>

</p-dialog>

<p-confirmDialog>
    <ng-template pTemplate="message" let-message>
        <div class="flex flex-column align-items-center w-full gap-3 border-bottom-1 surface-border">
            <i class="pi pi-exclamation-circle text-6xl text-primary-500"></i>
            <p>{{ message.message }}</p>
        </div>
    </ng-template>
</p-confirmDialog>

<p-toast [breakpoints]="{'920px': {width: '100%', right: '0', left: '0'}}" [showTransformOptions]="'translateY(100%)'" [showTransitionOptions]="'500ms'" [hideTransitionOptions]="'500ms'" [showTransformOptions]="'translateX(100%)'"></p-toast>
